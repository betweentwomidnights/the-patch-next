    <style>
        body {
            background-color: #000000;
            color: #ff0000;
            font-family: monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-transform: lowercase;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }
        
        h2 {
            font-size: 28px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        
        .loading-bar {
            width: 80%;
            height: 2px;
            background-color: #222;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
        }
        
        .loading-bar:after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background-color: #ff0000;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }
        
        .manual-link {
            margin-top: 30px;
            opacity: 0;
            animation: fade-in 0.5s forwards;
            animation-delay: 1.5s;
        }
        
        @keyframes fade-in {
            to { opacity: 1; }
        }
        
        a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #ff0000;
            padding-bottom: 2px;
            transition: all 0.2s;
        }
        
        a:hover {
            color: #ff0000;
            border-bottom-color: #ffffff;
        }
        
        .glitch {
            position: relative;
        }
        
        .glitch:after {
            content: 'taking you to gary4beatbox...';
            position: absolute;
            left: 2px;
            top: 0;
            color: rgba(255, 255, 255, 0.7); /* White with transparency */
            overflow: hidden;
            clip: rect(0, 900px, 0, 0);
            animation: noise-anim 2s infinite linear alternate-reverse;
        }
        
        .glitch:before {
            content: 'taking you to gary4beatbox...';
            position: absolute;
            left: -2px;
            top: 0;
            color: rgba(255, 0, 0, 0.7); /* Red with transparency */
            overflow: hidden;
            clip: rect(0, 900px, 0, 0);
            animation: noise-anim-2 3s infinite linear alternate-reverse;
        }

    <script>
    // Detection logic (same as before)
    const userAgent = navigator.userAgent.toLowerCase();
    const isIOS = /iphone|ipad|ipod|mac|ios/i.test(userAgent) ||
                 (/webkit/i.test(userAgent) && /safari/i.test(userAgent));
    const isAndroid = /android/i.test(userAgent);
    
    const ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=com.gary4beatbox';
    const IOS_STORE_URL = 'https://apps.apple.com/us/app/gary4beatbox/id6736522400';
    const DEFAULT_URL = 'https://thecollabagepatch.com';
    
    let targetUrl = DEFAULT_URL;
    if (isAndroid) {
        targetUrl = ANDROID_STORE_URL;
    } else if (isIOS) {
        targetUrl = IOS_STORE_URL;
    }

    // Redirect after a delay
    window.onload = function() {
        // Set link target
        document.getElementById('manual-link').href = targetUrl;
        
        // Add random glitch effects
        setInterval(function() {
            if (Math.random() > 0.85) {
                document.querySelector('.glitch').style.textShadow = 
                    `${Math.random() > 0.5 ? '' : '-'}${Math.random()}px 0 rgba(255,0,0,0.5), 
                     ${Math.random() > 0.5 ? '' : '-'}${Math.random()}px 0 rgba(255,255,255,0.5)`;
                
                setTimeout(function() {
                    document.querySelector('.glitch').style.textShadow = 'none';
                }, 50);
            }
        }, 200);
        
        // Redirect after animation time (2.5 seconds)
        setTimeout(function() {
            window.location.href = targetUrl;
        }, 2500);
    };
    </script>
