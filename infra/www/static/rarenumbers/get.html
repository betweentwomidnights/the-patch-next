        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            text-transform: lowercase;
        }
        
        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            position: relative;
            max-width: 800px;
            text-align: center;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden; /* Keep glitch effects contained */
        }
        
        /* Container glitch effects */
        .container-glitch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
        }
        
        .container-glitch-1 {
            background: radial-gradient(circle at 30% 70%, rgba(0, 0, 0, 0.05) 0%, transparent 70%);
            animation: container-glitch-1 8s infinite;
        }
        
        .container-glitch-2 {
            background: radial-gradient(circle at 70% 30%, rgba(0, 0, 0, 0.03) 0%, transparent 60%);
            animation: container-glitch-2 12s infinite;
        }
        
        .container-glitch-3 {
            background: linear-gradient(45deg, transparent 45%, rgba(0, 0, 0, 0.02) 50%, transparent 55%);
            animation: container-glitch-3 15s infinite;
        }
        
        /* Container content - ensure it's above the glitch */
        .container-content {
            position: relative;
            z-index: 2;
        }
        
        .logo-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 20px;
            color: #000;
        }
        
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #333;
        }
        
        .store-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .store-button {
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.3s;
            text-decoration: none;
            position: relative;
            z-index: 2;
        }
        
        .store-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .store-button img {
            width: 24px;
            height: 24px;
        }
        
        .store-button.apple {
            background: #fff;
            color: #000;
            border: 2px solid #000;
        }
        
        .store-button.android {
            background: #000;
            color: #fff;
            border: 2px solid #000;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #000;
            z-index: 1000;
            transform-origin: left;
            animation: loading 2s ease-in-out forwards;
        }
        
        /* Glitch effect for logo */
        .logo-glitch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 3;
            pointer-events: none;
        }
        
        .logo-glitch-1 {
            background: rgba(0, 0, 0, 0.1);
            animation: logo-glitch-1 2.5s infinite;
        }
        
        .logo-glitch-2 {
            background: rgba(0, 0, 0, 0.05);
            animation: logo-glitch-2 3.5s infinite;
        }
        
        /* Logo glitch animations */
        
        /* Container glitch animations */
        @keyframes container-glitch-1 {
            0%, 100% { opacity: 0; transform: translateX(0); }
            10%, 20% { opacity: 0.3; transform: translateX(-10px); }
            30%, 40% { opacity: 0.2; transform: translateX(10px); }
            50%, 60% { opacity: 0.15; transform: translateX(-5px); }
            70%, 80% { opacity: 0.1; transform: translateX(5px); }
            90% { opacity: 0; transform: translateX(0); }
        }
        
        @keyframes container-glitch-2 {
            0%, 100% { opacity: 0; transform: translateY(0); }
            15%, 25% { opacity: 0.2; transform: translateY(-8px); }
            40%, 50% { opacity: 0.15; transform: translateY(8px); }
            65%, 75% { opacity: 0.1; transform: translateY(-4px); }
            85%, 95% { opacity: 0.05; transform: translateY(4px); }
        }
        
        @keyframes container-glitch-3 {
            0%, 100% { opacity: 0; transform: scale(1); }
            20%, 30% { opacity: 0.1; transform: scale(1.02); }
            50%, 60% { opacity: 0.15; transform: scale(0.98); }
            70%, 80% { opacity: 0.1; transform: scale(1.01); }
        }
        
        @keyframes loading {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }
        
        .redirect-message {
            color: #666;
            margin-top: 20px;
            font-style: italic;
            font-size: 0.9rem;
        }
        
        .countdown {
            font-weight: bold;
        }
        
        .footer {
            margin-top: 50px;
            color: #666;
            font-size: 0.8rem;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .container {

            }
            
            .logo-container {
                width: 150px;
                height: 150px;
            }
            
            .store-buttons {
                flex-direction: column;
                align-items: center;
            }
        }

    <script>
        // Store URLs - replace with your actual App Store and Google Play URLs
        const IOS_STORE_URL = "https://apps.apple.com/us/app/6744262836";
        const ANDROID_STORE_URL = "https://play.google.com/store/apps/details?id=com.thecollabagepatch.rarenumbers";
        
        // Set the correct URLs for the buttons
        document.getElementById('ios-link').href = IOS_STORE_URL;
        document.getElementById('android-link').href = ANDROID_STORE_URL;
        
        // Detect device OS and redirect
        function detectDeviceAndRedirect() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // Check if this is a direct visit (not redirected yet) and not a bot/crawler
            const isBot = /bot|crawler|spider|crawling/i.test(userAgent);
            
            // Skip redirect for bots or social media crawlers to allow proper link preview
            if (isBot || userAgent.includes('facebookexternalhit') || userAgent.includes('Twitterbot')) {
                document.querySelector('.redirect-message').textContent = 'select your device above to download.';
                return;
            }
            
            // iOS detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                startCountdown(IOS_STORE_URL);
            } 
            // Android detection
            else if (/android/i.test(userAgent)) {
                startCountdown(ANDROID_STORE_URL);
            } 
            // Desktop or unknown device
            else {
                document.querySelector('.redirect-message').textContent = 'select your device above to download.';
            }
        }
        
        // Countdown and redirect
        function startCountdown(storeUrl) {
            let count = 5;
            const countdownElement = document.getElementById('countdown');
            
            const interval = setInterval(() => {
                count--;
                countdownElement.textContent = count;
                
                if (count <= 0) {
                    clearInterval(interval);
                    window.location.href = storeUrl;
                }
            }, 1000);
        }
        
        // Initialize
        window.onload = detectDeviceAndRedirect;
    </script>
