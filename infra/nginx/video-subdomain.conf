server {
    if ($host = video.thecollabagepatch.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name video.thecollabagepatch.com;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl;
    server_name video.thecollabagepatch.com;
    ssl_certificate /etc/letsencrypt/live/video.thecollabagepatch.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/video.thecollabagepatch.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Access-Control-Allow-Origin "https://thecollabagepatch.com";
    add_header Cross-Origin-Embedder-Policy "credentialless";
    add_header Cross-Origin-Opener-Policy "same-origin";

    root /var/www/video;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

}
