# Redirect HTTP to HTTPS
server {
    if ($host = www.thecollabagepatch.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = thecollabagepatch.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name thecollabagepatch.com www.thecollabagepatch.com;
    return 301 https://$host$request_uri;




}

# HTTPS server
server {
    listen 443 ssl;
    server_name thecollabagepatch.com www.thecollabagepatch.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/thecollabagepatch.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/thecollabagepatch.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Increase buffer size for audio streaming
    client_max_body_size 100M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # WebSocket handling
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # API routes
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # For streaming audio
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 300s;
    }

    # Worklet files
    location /worklet/ {
        alias /home/kev/the-patch-next/public/worklet/;
        default_type application/javascript;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Debug-Path $request_filename;
        autoindex on;
    }

	location /privacy-policy.html {
    	    root /var/www/static;
        	add_header Cache-Control "public, no-cache";
    }

	location /app-ads.txt {
    	    root /var/www/static;
        	add_header Cache-Control "public, no-cache";
    }

    location /status-api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redirect.html {
        root /var/www/static;
        add_header Cache-Control "public, no-cache";
    }
    
    location /redirect.js {
        root /var/www/static;
        add_header Cache-Control "public, no-cache";
        default_type application/javascript;
    }

    location /rarenumbers/ {
        root /var/www/static;
        add_header Cache-Control "public, no-cache";
    }

    # Default location
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


}
