name: Deploy

# Build on GitHub's runners (the VM is too small to run `next build`), then join the
# tailnet as tag:ci and ship the built .next to the VM over SSH, where
# scripts/deploy-remote.sh moves the checkout to this commit, swaps the build in,
# and restarts pm2. Public SSH on the VM stays closed; CI reaches it only via Tailscale.
#
# Two jobs on purpose: `npm ci` runs third-party install scripts, so the build job
# gets no deploy credentials at all. Only the deploy job can mint a Tailscale identity
# or see the SSH key.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package build
        run: tar czf build.tgz --exclude=.next/cache .next && ls -lh build.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: build.tgz
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # lets Tailscale verify this run via GitHub OIDC (no stored Tailscale secret)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: next-build

      - name: Join tailnet as tag:ci
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: the-patch

      - name: Ship to VM
        env:
          VM_DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
        run: |
          if [ -z "$VM_DEPLOY_KEY" ]; then
            echo "::error::Secret VM_DEPLOY_KEY is not set"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_DEPLOY_KEY" > ~/.ssh/vm_deploy
          chmod 600 ~/.ssh/vm_deploy
          # VM host key, pinned (from /etc/ssh/ssh_host_ed25519_key.pub on the VM)
          echo "the-patch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHabUw55wwQ40hTJ0dP43DkmRIvb8RpK0zbFDlj5p5GK" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/vm_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            kev@the-patch "deploy $GITHUB_SHA" < build.tgz
