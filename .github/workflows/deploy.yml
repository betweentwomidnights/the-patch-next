name: Deploy

# Build on GitHub's runners (the VM is too small to run `next build`),
# then ship the built .next to the VM, where scripts/deploy-remote.sh
# moves the checkout to this commit, swaps the build in, and restarts pm2.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package build
        run: tar czf "$RUNNER_TEMP/build.tgz" --exclude=.next/cache .next && ls -lh "$RUNNER_TEMP/build.tgz"

      - name: Ship to VM
        env:
          VM_DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
        run: |
          if [ -z "$VM_DEPLOY_KEY" ]; then
            echo "::error::Repository secret VM_DEPLOY_KEY is not set"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_DEPLOY_KEY" > ~/.ssh/vm_deploy
          chmod 600 ~/.ssh/vm_deploy
          # VM host key, pinned (read from /etc/ssh/ssh_host_ed25519_key.pub on the VM)
          echo "thecollabagepatch.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHabUw55wwQ40hTJ0dP43DkmRIvb8RpK0zbFDlj5p5GK" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/vm_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            kev@thecollabagepatch.com "deploy $GITHUB_SHA" < "$RUNNER_TEMP/build.tgz"
